# Build the game and put it on GitHub Pages.
#
# Runs on every push to main.
#
# The tests used to run here and no longer do. They are run constantly while
# the game is being worked on, which is where a failure is cheap to read and
# cheap to fix; up here they were a second opinion that could only ever stop
# the deploy.
#
# Which is what happened: one test simulates thirty seconds of flying and took
# longer than five seconds on the build machine, so the game stopped shipping
# over a timeout. It has a longer one now, but the lesson is the point -- a
# gate nobody can see the far side of is worse than no gate.
#
# The deploy is still gated. `npm run build` is `tsc --noEmit && vite build`,
# so nothing that fails to compile can ship, and that is the class of mistake
# a machine nobody is watching is good at catching.
name: Pages

on:
  push:
    branches: [main]
  # And by hand, from the Actions tab, for a redeploy without a commit.
  workflow_dispatch:

# What the deploy needs, and nothing else: read the code, write a Pages
# deployment, and prove to Pages who it is.
permissions:
  contents: read
  pages: write
  id-token: write

# One at a time. Two pushes in quick succession would otherwise race to
# publish, and the loser could be the newer one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # `ci` rather than `install`: it installs exactly what the lockfile says
      # and fails if the lockfile and package.json disagree, which is what you
      # want of a machine nobody is watching.
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
