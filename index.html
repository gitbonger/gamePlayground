<meta charset="utf-8" />
<!--
  `viewport-fit=cover` puts the page under the notch and the home bar rather
  than in a letterbox between them, and the panels keep clear of both with
  `env(safe-area-inset-*)` -- see the phone rules in `style.css`.

  Zooming is off because the controls are a thumb stick and a row of buttons:
  every gesture that would zoom a document is a gesture somebody is making at
  a pigeon, and a game you can accidentally magnify by flapping is a game with
  a bug in it.
-->
<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
/>
<title>Pigeon Sim</title>
<!--
  The bird's own head, rendered from the game's own rig rather than drawn: see
  `dev/face.html`, which is where these come from and how to make them again.

  Relative hrefs, like everything else here. GitHub Pages serves the site from
  a subdirectory named after the repository, so an absolute `/favicon.png` is a
  404 there -- the same reason Vite is configured with `base: './'`.

  Two sizes because a tab is 16 or 32 pixels and a low-poly head shrinks
  badly: left to downscale one image, the beak and the eye turn to porridge.
-->
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
<link rel="icon" type="image/png" sizes="180x180" href="./favicon.png" />
<link rel="apple-touch-icon" href="./favicon.png" />
<!--
  How the browser's own furniture gets out of the way.

  On Android, the game asks for the whole screen on the first tap and gets it
  -- see `begin` in `src/touch.ts`. iPhone Safari has no fullscreen for a page
  at all, so the toolbar at the bottom stays however the page is written. The
  way round it there is the home screen: added from the share sheet, a page
  with these tags launches in its own window with no toolbar and no address
  bar, which is the only chromeless iPhone there is.

  `black-translucent` puts the status bar over the game rather than in a band
  above it, which is why the panels keep clear of `env(safe-area-inset-top)`.
-->
<link rel="manifest" href="./manifest.webmanifest" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Pigeon" />
<meta name="theme-color" content="#0b1118" />
<link rel="stylesheet" href="/src/style.css" />

<canvas id="viewport"></canvas>
<div id="overlay">
</div>
<script type="module" src="/src/main.ts"></script>
