<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>icons</title>
    <link rel="stylesheet" href="../src/style.css" />
    <style>
      body { margin: 0; background: #0d1116; color: #f2f5f8; font-family: ui-monospace, Menlo, monospace; }
      .sheet { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; padding: 16px; }
      .cell { display: flex; flex-direction: column; align-items: center; gap: 6px;
              padding: 10px 4px; border: 1px solid rgba(242,245,248,0.12); border-radius: 8px;
              background: rgba(12,18,26,0.86); }
      .cell svg { width: 72px; height: 72px; fill: none; stroke: currentColor;
                  stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .cell small { font-size: 10px; opacity: 0.65; }
      .row { display: flex; align-items: center; gap: 10px; padding: 10px 16px; }
    </style>
  </head>
  <body>
    <div class="sheet" id="sheet"></div>
    <script type="module" src="./icons.ts"></script>
  </body>
</html>
