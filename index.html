<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pigeon Sim</title>
<link rel="stylesheet" href="/src/style.css" />

<canvas id="viewport"></canvas>
<div id="overlay">
  <div class="controls-hint">
    <b>W/S</b> pitch &nbsp; <b>A/D</b> roll &nbsp; <b>Q/E</b> yaw<br />
    <b>Space</b> flap &nbsp; <b>T</b> tuck &amp; dive<br />
    <b>B</b> brake — spread wings, beat backwards<br />
    <b>R</b> respawn &nbsp; <b>L</b> levels &nbsp; <b>H</b> hide panel<br />
    <span class="hint-warn">buildings are solid</span><br />
    <span class="hint-tip">to land: brake to slow, then beat + flare to settle</span><br />
    <span class="hint-tip">once down: <b>WASD</b> or arrows to walk, <b>Space</b> to take off — step off an edge and you are flying</span>
  </div>
</div>
<script type="module" src="/src/main.ts"></script>
