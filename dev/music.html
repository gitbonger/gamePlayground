<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>music</title>
    <style>
      body { margin: 0; padding: 24px 24px 60px; background: #0d1116; color: #f2f5f8;
             font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
      h1 { font-size: 15px; font-weight: 600; margin: 0 0 4px; }
      p.lead { opacity: 0.65; max-width: 64ch; line-height: 1.6; margin: 0 0 24px; }
      button { margin: 0 8px 8px 0; padding: 10px 18px; border: 1px solid #2b3440;
               border-radius: 8px; background: #161c24; color: inherit; font: inherit;
               cursor: pointer; }
      button.on { border-color: #9fd0ff; color: #9fd0ff; }
      #meter { margin-top: 20px; height: 10px; background: #161c24; border-radius: 5px;
               overflow: hidden; max-width: 420px; }
      #meter div { height: 100%; width: 0; background: #9fd0ff; }
      #trace { margin-top: 14px; font-size: 12px; opacity: 0.75; white-space: pre; }
      code { background: #161c24; padding: 1px 5px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <h1>The music, as it is actually played</h1>
    <p class="lead">
      No recordings and no soundfont: a few kilobytes of MIDI per piece, played
      through oscillators. Edit the notes in
      <code>scripts/make-music.py</code> and run it to hear something else.
    </p>
    <div id="keys"></div>
    <div id="meter"><div></div></div>
    <div id="trace"></div>
    <script type="module" src="./music.ts"></script>
  </body>
</html>
